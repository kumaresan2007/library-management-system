<div class="col-lg-3 mb-4">
    <div class="list-group shadow-sm">
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'student_dashboard' %}active{% endif %}" href="{% url 'accounts:student_dashboard' %}">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'books:book_list' %}">
