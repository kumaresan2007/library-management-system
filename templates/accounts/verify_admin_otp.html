{% extends "base.html" %}
{% block title %}Verify Admin OTP — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-2">Enter OTP</h1>
                <p class="text-muted small mb-4">We sent a 6-digit OTP to {{ email }}. It expires in 5 minutes.</p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">OTP</label>
                        <input type="text" name="otp" class="form-control" placeholder="Enter OTP" inputmode="numeric" autocomplete="one-time-code" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'accounts:admin_login' %}" class="small">Start over</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
