{# Sidebar navigation for librarian (admin) views #}
<div class="col-lg-3 mb-4">
    <div class="list-group shadow-sm">
        <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}" href="{% url 'accounts:admin_dashboard' %}">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'books:book_add' %}">
            <i class="bi bi-plus-circle me-2"></i> Add book
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'books:book_list' %}">
            <i class="bi bi-journal-text me-2"></i> All books
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'accounts:admin_students' %}">
            <i class="bi bi-people me-2"></i> Students
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'issues:admin_pending' %}">
            <i class="bi bi-hourglass-split me-2"></i> Pending requests
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'issues:admin_issued' %}">
            <i class="bi bi-bookmark-check me-2"></i> Issued books
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'issues:admin_overdue' %}">
            <i class="bi bi-exclamation-triangle me-2"></i> Overdue
        </a>
        <a class="list-group-item list-group-item-action" href="{% url 'reservations:admin_reservations' %}">
            <i class="bi bi-list-ol me-2"></i> Reservations
        </a>
    </div>
</div>
