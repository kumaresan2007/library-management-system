{% extends "base.html" %}
{% block title %}Reserve — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="h4 mb-3">Join waitlist</h1>
        <p>You are reserving: <strong>{{ book.title }}</strong></p>
        <p class="text-muted small">We email you when a copy is returned (FIFO queue).</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning">Confirm reservation</button>
            <a href="{% url 'books:book_detail' book.pk %}" class="btn btn-outline-secondary">Back</a>
        </form>
    </div>
</div>
{% endblock %}
